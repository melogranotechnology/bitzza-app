services:
  - type: web
    name: bitzza-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/bitzza.db
      - key: CORS_ORIGINS
        sync: false
