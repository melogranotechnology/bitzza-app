<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BITZZA Wallet</title>
<style>
:root{--bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--card:#fff;--text:#2d3748;--muted:#718096;--soft:#a0aec0;--accent:#ff6b35;--border:#e2e8f0;--input:#f8fafc}
body.dark{--bg:linear-gradient(135deg,#1a202c 0%,#2d3748 100%);--card:#1a202c;--text:#f7fafc;--muted:#a0aec0;--border:#4a5568;--input:#2d3748}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);background-attachment:fixed;min-height:100vh;display:flex;justify-content:center;padding:20px;color:var(--text)}
.wrap{background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:720px;box-shadow:0 25px 50px rgba(0,0,0,.2);margin:20px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
h1{font-size:24px;font-weight:700;color:var(--accent)}
h3{margin:18px 0 12px;font-size:16px}
.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{width:100%;padding:14px;background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.btn.primary:disabled{opacity:.6;cursor:not-allowed}
.btn.secondary{flex:1;padding:12px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{padding:12px 14px;background:transparent;border:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);background:var(--card)}
.field{margin-bottom:16px}
label{display:block;margin-bottom:6px;color:var(--text);font-weight:600;font-size:13px}
input,select{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:12px;font-size:15px;background:var(--input);color:var(--text);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.card{background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;border-radius:20px;padding:24px;text-align:center;margin-bottom:16px}
.card.portfolio{background:linear-gradient(135deg,#667eea,#764ba2);text-align:left}
.card .lbl{font-size:14px;opacity:.9}
.card .val{font-size:34px;font-weight:800;margin:8px 0 4px;word-break:break-all}
.card .fiat{font-size:14px;opacity:.85;margin-top:4px}
.card .total{font-size:18px;font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25);text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.15)}
.row:last-child{border:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--input);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.stat .v{font-size:15px;font-weight:700;margin-top:4px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.tx-info{flex:1;min-width:0;padding-right:12px}
.tx-title{font-weight:600;font-size:14px;margin-bottom:4px}
.tx-meta{font-size:12px;color:var(--muted)}
.tx-amt{font-weight:700;font-size:15px;white-space:nowrap}
.tx-amt.sent{color:#e53e3e}
.tx-amt.received{color:#38a169}
.tx-label{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#ebf8ff;color:#2b6cb0;font-weight:600;margin-top:4px}
.empty{text-align:center;padding:36px 20px;color:var(--soft);font-size:14px}
.contact{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.mini{padding:6px 10px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row .k{color:var(--muted);font-weight:600}
.info-row .v{font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12px;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.progress-bar{height:8px;background:rgba(0,0,0,.15);border-radius:4px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f7931e,#fb923c);transition:width .3s}
.progress-fill.reached{background:linear-gradient(90deg,#38a169,#4ade80)}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{padding:13px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.18);animation:slideIn .3s}
.toast.success{background:#f0fff4;color:#2f855a;border:1px solid #9ae6b4}
.toast.error{background:#fff5f5;color:#c53030;border:1px solid #feb2b2}
.toast.info{background:#ebf8ff;color:#2b6cb0;border:1px solid #90cdf4}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid rgba(255,107,53,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px 20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:20px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer}
.chart-box{background:var(--input);border-radius:14px;padding:16px;border:1px solid var(--border);margin:16px 0}
.chart-canvas{position:relative;height:220px}
.msg{padding:13px 16px;border-radius:12px;margin-bottom:16px;font-size:14px;font-weight:500}
.msg.info{background:#ebf8ff;border:1px solid #90cdf4;color:#2b6cb0}
.msg.error{background:#fff5f5;border:1px solid #feb2b2;color:#c53030}
.footer{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);color:var(--soft);font-size:12px}
@media(max-width:520px){body{padding:0}.wrap{padding:16px;border-radius:0;margin:0;min-height:100vh}.filter{grid-template-columns:1fr}.toast-wrap{left:12px;right:12px;max-width:none}}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div><div style="margin-top:12px">Avvio BITZZA Wallet...</div></div></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;
const API='http://localhost:3000/api';
const TK='bitzza_token';
const PRICES={Pomodoro:2,Grano:1,Latte:1.5};

async function api(path,opts){
  opts=opts||{};
  const token=localStorage.getItem(TK);
  const headers=Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{},opts.headers||{});
  let res;
  try{res=await fetch(API+path,Object.assign({},opts,{headers}));}catch(e){throw new Error('Server non raggiungibile');}
  let data={};
  const ct=res.headers.get('content-type')||'';
  if(ct.indexOf('json')!==-1){data=await res.json().catch(()=>({}));}else{const t=await res.text();data={message:t};}
  if(!res.ok)throw new Error(data.error||data.message||('HTTP '+res.status));
  return data;
}
function money(n){if(n===null||n===undefined||isNaN(n))return '--';return Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});}
function dt(s){if(!s)return '';const d=new Date(String(s).replace(' ','T'));if(isNaN(d.getTime()))return s;return d.toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}

function Toasts({list,onClose}){
  return React.createElement('div',{className:'toast-wrap'},list.map(t=>React.createElement('div',{key:t.id,className:'toast '+t.type,onClick:()=>onClose(t.id)},t.text)));
}

function Auth({onAuth}){
  const [mode,setMode]=useState('login');
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [conf,setConf]=useState('');
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState(false);
  function submit(e){
    e.preventDefault();setErr(null);setBusy(true);
    if(mode==='register'){
      if(!email||!pass||!conf){setErr('Tutti i campi richiesti');setBusy(false);return;}
      if(pass.length<6){setErr('Password minimo 6 caratteri');setBusy(false);return;}
      if(pass!==conf){setErr('Password non coincidono');setBusy(false);return;}
      api('/register',{method:'POST',body:JSON.stringify({email,password:pass})})
        .then(d=>{localStorage.setItem(TK,d.token);onAuth(d.token);})
        .catch(e=>setErr(e.message)).finally(()=>setBusy(false));
    }else{
      if(!email||!pass){setErr('Email e password richiesti');setBusy(false);return;}
      api('/login',{method:'POST',body:JSON.stringify({email,password:pass})})
        .then(d=>{localStorage.setItem(TK,d.token);onAuth(d.token);})
        .catch(e=>setErr(e.message)).finally(()=>setBusy(false));
    }
  }
  return React.createElement('div',{className:'wrap',style:{maxWidth:460}},
    React.createElement('h1',{style:{textAlign:'center'}},'BITZZA Wallet'),
    React.createElement('p',{style:{textAlign:'center',color:'var(--muted)',marginBottom:22,fontSize:14}},mode==='login'?'Accedi':'Crea account'),
    err?React.createElement('div',{className:'msg error'},err):null,
    React.createElement('form',{onSubmit:submit},
      React.createElement('div',{className:'field'},React.createElement('label',null,'Email'),React.createElement('input',{type:'email',value:email,onChange:e=>setEmail(e.target.value),placeholder:'tu@esempio.com'})),
      React.createElement('div',{className:'field'},React.createElement('label',null,'Password'),React.createElement('input',{type:'password',value:pass,onChange:e=>setPass(e.target.value),placeholder:'min 6 caratteri'})),
      mode==='register'?React.createElement('div',{className:'field'},React.createElement('label',null,'Conferma Password'),React.createElement('input',{type:'password',value:conf,onChange:e=>setConf(e.target.value),placeholder:'ripeti'})):null,
      React.createElement('button',{className:'btn primary',type:'submit',disabled:busy},busy?'Attendi...':(mode==='login'?'Accedi':'Registrati'))
    ),
    React.createElement('p',{style:{textAlign:'center',marginTop:18,fontSize:14,color:'var(--muted)'}},
      mode==='login'?'Non hai account? ':'Hai account? ',
      React.createElement('button',{type:'button',onClick:()=>{setMode(mode==='login'?'register':'login');setErr(null);},style:{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontWeight:700,fontSize:14}},mode==='login'?'Registrati':'Accedi')
    ),
    React.createElement('div',{className:'footer'},'BITZZA Wallet - demo')
  );
}

function Wallet({onLogout,toast}){
  const [tab,setTab]=useState('balance');
  const [loading,setLoading]=useState(true);
  const [balance,setBalance]=useState(null);
  const [profile,setProfile]=useState(null);
  const [txs,setTxs]=useState([]);
  const [market,setMarket]=useState(null);
  const [tokenInfo,setTokenInfo]=useState(null);
  const [contacts,setContacts]=useState([]);
  const [commodities,setCommodities]=useState({Pomodoro:0,Grano:0,Latte:0});
  const [pizza,setPizza]=useState({target_usd:12.5,current_usd:0,percentage:0,reached:false,message:''});
  const [mining,setMining]=useState({canClaim:false,secondsRemaining:0,totalMined:0,currentDifficulty:1,nextReward:0.5,claiming:false});
  const [theme,setTheme]=useState(()=>localStorage.getItem('bitzza_theme')||'light');
  const [cMode,setCMode]=useState('buy');
  const [cForm,setCForm]=useState({commodity:'Pomodoro',units:''});
  const [cBusy,setCBusy]=useState(false);
  const [recipient,setRecipient]=useState('');
  const [amount,setAmount]=useState('');
  const [desc,setDesc]=useState('');
  const [label,setLabel]=useState('');
  const [busySend,setBusySend]=useState(false);
  const [pin,setPin]=useState({open:false,tx:null,code:'',error:''});
  const [abLabel,setAbLabel]=useState('');
  const [abAddr,setAbAddr]=useState('');
  const [fType,setFType]=useState('all');
  const [fSearch,setFSearch]=useState('');
  const chartRef=useRef(null);
  const chartInstance=useRef(null);

  useEffect(()=>{document.body.classList.toggle('dark',theme==='dark');localStorage.setItem('bitzza_theme',theme);},[theme]);

  const reload=useCallback(()=>{
    setLoading(true);
    Promise.all([
      api('/balance'),api('/profile'),api('/transactions?limit=100'),
      api('/market/data'),api('/token/info'),api('/address-book'),
      api('/commodities'),api('/pizza/target'),api('/mining/status')
    ]).then(r=>{
      setBalance(r[0].balance);
      setProfile(r[1]);
      setTxs(r[2].transactions||[]);
      setMarket(r[3]);
      setTokenInfo(r[4]);
      setContacts(r[5].contacts||[]);
      setCommodities(r[6].holdings||{Pomodoro:0,Grano:0,Latte:0});
      setPizza(r[7]);
      setMining(m=>({...m,canClaim:r[8].canClaim,secondsRemaining:r[8].secondsRemaining,totalMined:r[8].totalMined,currentDifficulty:r[8].currentDifficulty||1,nextReward:r[8].nextReward||0.5}));
    }).catch(e=>{
      if(e.message.indexOf('token')!==-1||e.message.indexOf('Invalid')!==-1)onLogout();
      else toast('error',e.message);
    }).finally(()=>setLoading(false));
  },[onLogout,toast]);

  useEffect(()=>{reload();},[reload]);

  useEffect(()=>{
    const id=setInterval(()=>{
      api('/market/data').then(setMarket).catch(()=>{});
      api('/pizza/target').then(setPizza).catch(()=>{});
      api('/mining/status').then(s=>setMining(m=>({...m,canClaim:s.canClaim,secondsRemaining:s.secondsRemaining,totalMined:s.totalMined,currentDifficulty:s.currentDifficulty||1,nextReward:s.nextReward||0.5}))).catch(()=>{});
    },15000);
    return ()=>clearInterval(id);
  },[]);

  useEffect(()=>{
    if(mining.secondsRemaining<=0)return;
    const id=setInterval(()=>setMining(m=>{const n=Math.max(0,m.secondsRemaining-1);return {...m,secondsRemaining:n,canClaim:n===0};}),1000);
    return ()=>clearInterval(id);
  },[mining.secondsRemaining>0]);

  useEffect(()=>{
    if(tab!=='token')return;
    let cancelled=false;
    const load=async()=>{
      try{
        const d=await api('/market/history?limit=30');
        if(cancelled||!chartRef.current||typeof Chart==='undefined')return;
        const labels=(d.history||[]).map(h=>{const dt=new Date(String(h.timestamp).replace(' ','T'));return isNaN(dt.getTime())?'':dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});});
        const prices=(d.history||[]).map(h=>h.price_usd);
        if(chartInstance.current){chartInstance.current.destroy();chartInstance.current=null;}
        const ctx=chartRef.current.getContext('2d');
        const grad=ctx.createLinearGradient(0,0,0,220);
        grad.addColorStop(0,'rgba(255,107,53,.35)');grad.addColorStop(1,'rgba(255,107,53,.02)');
        chartInstance.current=new Chart(ctx,{
          type:'line',
          data:{labels,datasets:[{data:prices,borderColor:'#ff6b35',backgroundColor:grad,borderWidth:2.5,fill:true,tension:.35,pointRadius:0}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{grid:{color:'rgba(128,128,128,.12)'},ticks:{color:'#a0aec0',font:{size:10}}}}}
        });
      }catch(e){}
    };
    load();
    const id=setInterval(load,20000);
    return()=>{cancelled=true;clearInterval(id);if(chartInstance.current){chartInstance.current.destroy();chartInstance.current=null;}};
  },[tab]);

  function doMine(){
    setMining(m=>({...m,claiming:true}));
    api('/mining/claim',{method:'POST'})
      .then(r=>{
        setMining(m=>({...m,canClaim:false,secondsRemaining:60,claiming:false,totalMined:r.totalMined||m.totalMined+r.amount,currentDifficulty:r.currentDifficulty||m.currentDifficulty,nextReward:r.amount}));
        setBalance(r.newBalance);
        toast('success','+'+money(r.amount)+' BITZ minati');
      })
      .catch(e=>{setMining(m=>({...m,claiming:false}));toast('error',e.message);});
  }

  function doBuy(){
    const units=parseFloat(cForm.units);
    if(isNaN(units)||units<=0)return toast('error','Unità non valide');
    setCBusy(true);
    api('/commodities/buy',{method:'POST',body:JSON.stringify({commodity:cForm.commodity,units})})
      .then(r=>{setCommodities(c=>({...c,[cForm.commodity]:r.newHolding}));setBalance(r.newBalance);setCForm({...cForm,units:''});toast('success','Acquistato '+units+' '+cForm.commodity);})
      .catch(e=>toast('error',e.message)).finally(()=>setCBusy(false));
  }

  function doSell(){
    const units=parseFloat(cForm.units);
    if(isNaN(units)||units<=0)return toast('error','Unità non valide');
    setCBusy(true);
    api('/commodities/sell',{method:'POST',body:JSON.stringify({commodity:cForm.commodity,units})})
      .then(r=>{setCommodities(c=>({...c,[cForm.commodity]:r.newHolding}));setBalance(r.newBalance);setCForm({...cForm,units:''});toast('success','Venduto '+units+' '+cForm.commodity+' per '+money(r.bitzReceived)+' BITZ');})
      .catch(e=>toast('error',e.message)).finally(()=>setCBusy(false));
  }

  function prepareSend(e){
    e.preventDefault();
    const a=parseFloat(amount);
    if(!recipient)return toast('error','Inserisci destinatario');
    if(isNaN(a)||a<=0)return toast('error','Importo non valido');
    if(balance!==null&&a>balance)return toast('error','Saldo insufficiente');
    if(a>10){setPin({open:true,tx:{recipient,amount:a,desc,label},code:'',error:''});}
    else{doSendNow({recipient,amount:a,desc,label});}
  }

  function confirmPin(){
    if(pin.code!=='1234'){setPin({...pin,error:'PIN errato (prova 1234)'});return;}
    const tx=pin.tx;
    setPin({open:false,tx:null,code:'',error:''});
    doSendNow(tx);
  }

  function doSendNow(tx){
    setBusySend(true);
    api('/send',{method:'POST',body:JSON.stringify({recipientEmail:tx.recipient,amount:tx.amount,description:tx.desc||undefined,label:tx.label||undefined})})
      .then(()=>{toast('success','Inviati '+money(tx.amount)+' BITZ a '+tx.recipient);setRecipient('');setAmount('');setDesc('');setLabel('');reload();})
      .catch(e=>toast('error',e.message)).finally(()=>setBusySend(false));
  }

  function addContact(e){
    e.preventDefault();
    if(!abLabel||!abAddr)return toast('error','Compila etichetta e email');
    api('/address-book',{method:'POST',body:JSON.stringify({label:abLabel,address:abAddr})})
      .then(()=>{toast('success','Contatto salvato');setAbLabel('');setAbAddr('');return api('/address-book');})
      .then(d=>setContacts(d.contacts||[])).catch(e=>toast('error',e.message));
  }

  function delContact(id){
    api('/address-book/'+id,{method:'DELETE'})
      .then(()=>{setContacts(c=>c.filter(x=>x.id!==id));toast('info','Contatto rimosso');})
      .catch(e=>toast('error',e.message));
  }

  function exportWallet(){
    api('/wallet/export').then(data=>{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='bitzza-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
      toast('success','Backup esportato');
    }).catch(e=>toast('error',e.message));
  }

  function copyEmail(){
    if(!profile)return;
    navigator.clipboard.writeText(profile.email).then(()=>toast('success','Email copiata')).catch(()=>toast('error','Copia fallita'));
  }

  const filtered=txs.filter(tx=>{
    if(fType!=='all'&&tx.type!==fType)return false;
    if(fSearch){const q=fSearch.toLowerCase();const h=((tx.description||'')+' '+(tx.label||'')+' '+(tx.otherParty||'')).toLowerCase();if(h.indexOf(q)===-1)return false;}
    return true;
  });

  const commoditiesValue=(commodities.Pomodoro||0)*2+(commodities.Grano||0)*1+(commodities.Latte||0)*1.5;
  const totalBitz=(balance||0)+commoditiesValue;
  const priceUsd=market&&market.price_usd?market.price_usd:12.5;
